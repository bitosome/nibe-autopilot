name: Integration checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - run: pip install -r requirements-test.txt
      - run: ruff check custom_components/nibe_autopilot integration_tests scripts/generate_integration_strings.py scripts/build_integration.py
      - run: ruff format --check custom_components/nibe_autopilot integration_tests scripts/generate_integration_strings.py scripts/build_integration.py
      - run: python -m pytest integration_tests
      - run: PYTHONPATH=. python scripts/generate_integration_strings.py && git diff --exit-code -- custom_components/nibe_autopilot/strings.json custom_components/nibe_autopilot/translations/en.json
      - run: python scripts/build_integration.py
      - uses: actions/upload-artifact@v4
        with:
          name: nibe-autopilot
          path: dist/nibe-autopilot.zip
