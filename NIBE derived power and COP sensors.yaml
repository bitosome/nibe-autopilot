sensor:
  - platform: derivative
    source: sensor.heat_meter_heat_cpr_and_add_total_system_42439
    name: NIBE Produced Space Heat Power kW Raw
    unit_time: h
    unit: kW
    round: 3
    time_window: "00:15:00"

  - platform: derivative
    source: sensor.heat_meter_hw_cpr_and_add_total_system_42437
    name: NIBE Produced DHW Heat Power kW Raw
    unit_time: h
    unit: kW
    round: 3
    time_window: "00:15:00"

template:
  - sensor:
      - name: "NIBE Produced Space Heat Power kW"
        unique_id: nibe_produced_space_heat_power_kw
        unit_of_measurement: "kW"
        device_class: power
        state_class: measurement
        state: >
          {{ [states('sensor.nibe_produced_space_heat_power_kw_raw')|float(0), 0] | max | round(2) }}

      - name: "NIBE Produced DHW Heat Power kW"
        unique_id: nibe_produced_dhw_heat_power_kw
        unit_of_measurement: "kW"
        device_class: power
        state_class: measurement
        state: >
          {{ [states('sensor.nibe_produced_dhw_heat_power_kw_raw')|float(0), 0] | max | round(2) }}

      - name: "NIBE Produced Heat Total Power kW"
        unique_id: nibe_produced_heat_total_power_kw
        unit_of_measurement: "kW"
        device_class: power
        state_class: measurement
        state: >
          {% set p_space = states('sensor.nibe_produced_space_heat_power_kw')|float(0) %}
          {% set p_dhw = states('sensor.nibe_produced_dhw_heat_power_kw')|float(0) %}
          {{ (p_space + p_dhw) | round(2) }}

      - name: "NIBE Total Input Power kW"
        unique_id: nibe_total_input_power_kw
        unit_of_measurement: "kW"
        device_class: power
        state_class: measurement
        state: >
          {% set p_comp = states('sensor.compr_in_power_43141')|float(0) %}
          {% set p_add = states('sensor.int_el_add_power_43084')|float(0) %}
          {{ (p_comp + p_add) | round(2) }}

      - name: "NIBE Estimated COP Instant"
        unique_id: nibe_estimated_cop_instant
        state_class: measurement
        state: >
          {% set p_in = states('sensor.nibe_total_input_power_kw')|float(0) %}
          {% set p_out = states('sensor.nibe_produced_heat_total_power_kw')|float(0) %}
          {% if p_in >= 0.25 and p_out >= 0 %}
            {{ (p_out / p_in) | round(2) }}
          {% else %}
            0
          {% endif %}
