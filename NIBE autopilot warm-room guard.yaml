alias: NIBE autopilot warm-room guard
description: >-
  Engages the guard loop when rooms overshoot and releases gently once demand
  returns.
triggers:
  - value_template: >-
      {% set enabled = is_state('input_boolean.nibe_autopilot_state', 'on') %}
      {% if not enabled %}
        false
      {% else %}
        {% set t_in = states('sensor.home_temperature_average') %}
        {% set t_set = states('input_number.indoor_target_temperature') %}
        {% if t_in in ['unknown', 'unavailable', ''] or t_set in ['unknown', 'unavailable', ''] %}
          false
        {% else %}
          {{ t_in|float >= (t_set|float + 0.4) }}
        {% endif %}
      {% endif %}
    for: "00:02:00"
    trigger: template
conditions: []
actions:
  - condition: state
    entity_id: input_boolean.nibe_autopilot_state
    state: "on"
  - variables:
      guard_min_offset: -6
      guard_exit_offset: 0
      guard_release_delay: "00:08:00"
      guard_step: 2
      guard_step_delay: "00:01:30"
      pre_guard_offset: "{{ states('number.heat_offset_s1_47011')|int(0) }}"
  - repeat:
      sequence:
        - data:
            value: >-
              {% set current = states('number.heat_offset_s1_47011')|int(0) %}
              {% set candidate = current - guard_step %} {% if candidate <
              guard_min_offset %}{{ guard_min_offset }}{% else %}{{ candidate
              }}{% endif %}
          target:
            entity_id: number.heat_offset_s1_47011
          action: number.set_value
        - delay: "{{ guard_step_delay }}"
      while:
        - condition: state
          entity_id: input_boolean.nibe_autopilot_state
          state: "on"
        - condition: template
          value_template: >-
            {{ states('number.heat_offset_s1_47011')|float(0) > guard_min_offset
            }}
  - data:
      value: 0
    target:
      entity_id: number.max_int_add_power_47212
    action: number.set_value
  - wait_for_trigger:
      - value_template: >-
          {% set t_in = states('sensor.home_temperature_average') %} {% set
          t_set = states('input_number.indoor_target_temperature') %} {% if t_in
          in ['unknown', 'unavailable', ''] or t_set in ['unknown',
          'unavailable', ''] %}
            false
          {% else %}
            {{ t_in|float <= (t_set|float - 0.3) }}
          {% endif %}
        trigger: template
      - entity_id: input_boolean.nibe_autopilot_state
        to: "off"
        trigger: state
    timeout: "03:00:00"
  - choose:
      - conditions:
          - condition: state
            entity_id: input_boolean.nibe_autopilot_state
            state: "on"
          - condition: template
            value_template: >-
              {% set t_in = states('sensor.home_temperature_average') %} {% set
              t_set = states('input_number.indoor_target_temperature') %} {{
              t_in|float <= (t_set|float - 0.1) }}
        sequence:
          - alias: Ramp offset back toward demand (respecting open floor loops)
            variables:
              open_zones: >-
                {% set ns = namespace(n=0) %} {% for e in zone_climate_entities
                %}
                  {% if state_attr(e, 'hvac_action') == 'heating' %}{% set ns.n = ns.n + 1 %}{% endif %}
                {% endfor %} {{ ns.n }}
              active_zones: >-
                {% set ns = namespace(a=0) %} {% for e in zone_climate_entities
                %}
                  {% if states(e) not in ['off', 'unavailable', 'unknown'] %}{% set ns.a = ns.a + 1 %}{% endif %}
                {% endfor %} {{ ns.a }}
              zone_offset_cap: >-
                {% set n = open_zones|int(0) %} {% if n >= 5 %}6{% elif n == 4
                %}4{% elif n == 3 %}2{% elif n == 2 %}0{% elif n == 1 %}-2{% else
                %}-4{% endif %}
              release_base: >-
                {% if pre_guard_offset|int > guard_exit_offset|int %}{{
                pre_guard_offset|int }}{% else %}{{ guard_exit_offset|int }}{%
                endif %}
              release_target: >-
                {{ [release_base|int, zone_offset_cap|int] | min if
                (active_zones|int(0) > 0) else release_base|int }}
          - repeat:
              sequence:
                - data:
                    value: >-
                      {% set current =
                      states('number.heat_offset_s1_47011')|int(0) %} {% set
                      candidate = current + guard_step %} {% if candidate >
                      release_target %}{{ release_target }}{% else %}{{
                      candidate }}{% endif %}
                  target:
                    entity_id: number.heat_offset_s1_47011
                  action: number.set_value
                - delay: "{{ guard_step_delay }}"
              while:
                - condition: state
                  entity_id: input_boolean.nibe_autopilot_state
                  state: "on"
                - condition: template
                  value_template: >-
                    {{ states('number.heat_offset_s1_47011')|int(0) <
                    release_target }}
          - delay: "{{ guard_release_delay }}"
          - data:
              entity_id: automation.nibe_autopilot
              skip_condition: false
            action: automation.trigger
mode: single
variables:
  zone_climate_entities:
    - climate.thermostat_controller_workshop
    - climate.thermostat_controller_mira_s_room
    - climate.thermostat_controller_office
    - climate.thermostat_controller_wc_1_entrance_storeroom_hallway
    - climate.thermostat_controller_kitchen_living_room
    - climate.thermostat_controller_bedroom
    - climate.thermostat_controller_wc_2_shower_room
