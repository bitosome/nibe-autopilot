substitutions:
  device_friendly_name: "NIBEGW"
  device_name: "nibegw"
  device_make: "NIBE"
  device_model: "F1255-6 R"
  package_version: "3.0.0"

  wifi_ssid: !secret wifi_ssid
  wifi_password: !secret wifi_password
  ota_password: !secret ota_password
  ap_password: !secret ap_password


external_components:
  - source: github://elupus/esphome-nibe


esphome:
  name: "${device_name}"
  friendly_name: "${device_friendly_name}"
  comment: "${device_model} by ${device_make} version ${package_version}"


esp32:
  board: esp32dev
  framework:
    type: arduino
    version: recommended


api:
  reboot_timeout: 0s


ota:
  - platform: esphome
    password: ${ota_password}


logger:


wifi:
  ssid: ${wifi_ssid}
  password: ${wifi_password}
  fast_connect: true
  power_save_mode: none


output:
  - platform: gpio
    id: ENABLE_PIN
    pin:
      number: GPIO19
      inverted: true
  - platform: gpio
    id: SE_PIN
    pin:
      number: GPIO17
      inverted: true
  - platform: gpio
    id: ENABLE_5V_PIN
    pin:
      number: GPIO16
      inverted: true


uart:
  rx_pin: GPIO21
  tx_pin: GPIO22
  baud_rate: 9600


nibegw:
  udp:
    target:
      - ip: 192.168.0.13    # Home Assistant IP.
        # port: 9999        # Default: 9999
    source: []              # List of source address to accept data from, may be empty for no filter
    # read_port: 9999       # Optional port this device will listen to to receive read requests. Defaults to 9999
    # write_port: 10000     # Optional port this device will listen to to receive write request. Defaults to 10000
  acknowledge:
    - MODBUS40
  constants:
    - address: MODBUS40
      token: ACCESSORY
      data:
        - 0x0A
        - 0x00
        - 0x01


button:
  - platform: restart
    name: Nibegw Restart
  - platform: safe_mode
    name: Nibegw Safe Mode Boot