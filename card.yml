type: vertical-stack
cards:
  - type: entities
    title: NIBE controls
    entities:
      - entity: input_boolean.nibe_autopilot_state
        name: Autopilot
      - entity: automation.nibe_night_quiet_mode
        name: Night quiet mode
      - entity: input_number.indoor_target_temperature
        name: Indoor target
      - entity: input_number.nibe_max_add_heat_kw
        name: Max add-heat cap
      - entity: input_number.nibe_heat_bias
        name: Heat bias trim
      - entity: number.max_supply_system_1_47019
        name: Max supply ceiling
      - entity: number.heat_offset_s1_47011
        name: Heating curve offset
      - entity: number.max_int_add_power_47212
        name: Max add heat (kW)
      - entity: number.max_comp_freq_47104
        name: Max compressor freq (Hz)
  - type: glance
    title: NIBE status
    columns: 3
    entities:
      - entity: sensor.compressor_state_ep14_43427
        name: Compressor
      - entity: sensor.compressor_frequency_actual_43136
        name: Freq Hz
      - entity: sensor.prio_43086
        name: Priority
      - entity: sensor.eb100_ep14_bt14_hot_gas_temp_40018
        name: Hot gas
      - entity: sensor.nibe_estimated_cop_instant
        name: COP
      - entity: sensor.alarm_45001
        name: Alarm
  - type: custom:apexcharts-card
    header:
      show: true
      title: Room Temperatures
    all_series_config:
      stroke_width: 2
      curve: smooth
    series:
      - entity: sensor.workshop_light_switch_temperature
        name: Workshop
        yaxis_id: temp
        color: '#ef4444'
      - entity: sensor.mira_s_room_light_switch_temperature
        name: Mira's room
        yaxis_id: temp
        color: '#f97316'
      - entity: sensor.office_light_switch_1_temperature
        name: Office
        yaxis_id: temp
        color: '#facc15'
      - entity: sensor.wc_1_entrance_hallway_temperature_average
        name: WC1/entrance/hallway
        yaxis_id: temp
        color: '#22c55e'
      - entity: sensor.living_room_temperature_average
        name: Kitchen/living
        yaxis_id: temp
        color: '#0ea5e9'
      - entity: sensor.wc_2_light_switch_1_temperature
        name: Bedroom
        yaxis_id: temp
        color: '#6366f1'
      - entity: sensor.wc_2_shower_room_temperature_average
        name: Shower
        yaxis_id: temp
        color: '#a855f7'
      - entity: input_number.indoor_target_temperature
        name: Target
        yaxis_id: temp
        color: '#94a3b8'
        stroke_width: 1
        stroke_dash: 4
    yaxis:
      - id: temp
        decimals: 1
        min: 15
        max: 25
        opposite: false
  - type: custom:apexcharts-card
    header:
      show: true
      title: Control & compressor
    graph_span: 24h
    all_series_config:
      stroke_width: 2
    series:
      - entity: number.heat_offset_s1_47011
        name: Offset
        type: column
        yaxis_id: offset
        color: '#6366f1'
      - entity: sensor.compressor_frequency_actual_43136
        name: Compressor Hz
        yaxis_id: hz
        color: '#2563eb'
      - entity: number.max_comp_freq_47104
        name: Max Hz limit
        yaxis_id: hz
        color: '#94a3b8'
        stroke_dash: 3
    yaxis:
      - id: offset
        min: -10
        max: 10
        decimals: 0
        opposite: false
      - id: hz
        min: 0
        max: 130
        decimals: 0
        opposite: true
  - type: custom:apexcharts-card
    header:
      show: true
      title: Floor loops open (by room)
    graph_span: 24h
    stacked: true
    all_series_config:
      type: column
      stroke_width: 0
    series:
      - entity: climate.thermostat_controller_workshop
        attribute: hvac_action
        name: Workshop
        color: '#ef4444'
        transform: 'return x === ''heating'' ? 1 : 0;'
      - entity: climate.thermostat_controller_mira_s_room
        attribute: hvac_action
        name: Mira's room
        color: '#f97316'
        transform: 'return x === ''heating'' ? 1 : 0;'
      - entity: climate.thermostat_controller_office
        attribute: hvac_action
        name: Office
        color: '#facc15'
        transform: 'return x === ''heating'' ? 1 : 0;'
      - entity: climate.thermostat_controller_wc_1_entrance_storeroom_hallway
        attribute: hvac_action
        name: WC1/entrance/hallway
        color: '#22c55e'
        transform: 'return x === ''heating'' ? 1 : 0;'
      - entity: climate.thermostat_controller_kitchen_living_room
        attribute: hvac_action
        name: Kitchen/living
        color: '#0ea5e9'
        transform: 'return x === ''heating'' ? 1 : 0;'
      - entity: climate.thermostat_controller_bedroom
        attribute: hvac_action
        name: Bedroom
        color: '#6366f1'
        transform: 'return x === ''heating'' ? 1 : 0;'
      - entity: climate.thermostat_controller_wc_2_shower_room
        attribute: hvac_action
        name: Shower
        color: '#a855f7'
        transform: 'return x === ''heating'' ? 1 : 0;'
    yaxis:
      - min: 0
        max: 7
        decimals: 0
  - type: custom:apexcharts-card
    header:
      show: true
      title: Overheat watch (condenser & supply)
    graph_span: 24h
    all_series_config:
      stroke_width: 2
      curve: smooth
    series:
      - entity: sensor.calc_supply_s1_43009
        name: Calc supply target
        yaxis_id: temp
        color: '#94a3b8'
        stroke_dash: 4
      - entity: number.max_supply_system_1_47019
        name: Max supply ceiling
        yaxis_id: temp
        color: '#dc2626'
        stroke_width: 1
        stroke_dash: 6
      - entity: sensor.bt2_supply_temp_s1_40008
        name: Supply BT2
        yaxis_id: temp
        color: '#f97316'
      - entity: sensor.eb100_ep14_bt12_condensor_out_40017
        name: Condenser out BT12
        yaxis_id: temp
        color: '#ef4444'
      - entity: sensor.eb100_ep14_bt14_hot_gas_temp_40018
        name: Hot gas BT14
        yaxis_id: temp
        color: '#b91c1c'
    yaxis:
      - id: temp
        decimals: 1
        opposite: false
