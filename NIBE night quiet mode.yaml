alias: NIBE night quiet mode
description: >-
  Governs max compressor frequency. Reduces night-time compressor noise and
  caps compressor frequency when few underfloor loops are open, to avoid
  high-pressure / overheat when floor loops close. Sole writer of
  number.max_comp_freq_47104.
triggers:
  - trigger: time
    at: "22:30:00"
  - trigger: time
    at: "06:30:00"
  - trigger: time_pattern
    minutes: /10
  - trigger: state
    entity_id:
      - climate.thermostat_controller_workshop
      - climate.thermostat_controller_mira_s_room
      - climate.thermostat_controller_office
      - climate.thermostat_controller_wc_1_entrance_storeroom_hallway
      - climate.thermostat_controller_kitchen_living_room
      - climate.thermostat_controller_bedroom
      - climate.thermostat_controller_wc_2_shower_room
    attribute: hvac_action
    for: "00:01:00"
conditions: []
actions:
  - variables:
      night_start: "22:30:00"
      night_end: "06:30:00"
      quiet_max_comp_hz: 75
      day_max_comp_hz: 120
      comfort_rescue_delta_c: 0.7
      t_in: "{{ states('sensor.home_temperature_average')|float(0) }}"
      t_set: "{{ states('input_number.indoor_target_temperature')|float(22) }}"
      comfort_deficit: "{{ (t_set - t_in)|float(0) }}"
      autopilot_on: "{{ is_state('input_boolean.nibe_autopilot_state', 'on') }}"
      in_night_window: >-
        {% set hm = now().strftime('%H:%M:%S') %}
        {{ (hm >= night_start) or (hm < night_end) }}
      noise_target_hz: >-
        {% if in_night_window and autopilot_on and (comfort_deficit < comfort_rescue_delta_c) %}
          {{ quiet_max_comp_hz }}
        {% else %}
          {{ day_max_comp_hz }}
        {% endif %}
      zone_climate_entities:
        - climate.thermostat_controller_workshop
        - climate.thermostat_controller_mira_s_room
        - climate.thermostat_controller_office
        - climate.thermostat_controller_wc_1_entrance_storeroom_hallway
        - climate.thermostat_controller_kitchen_living_room
        - climate.thermostat_controller_bedroom
        - climate.thermostat_controller_wc_2_shower_room
      open_zones: >-
        {% set ns = namespace(n=0) %}
        {% for e in zone_climate_entities %}
          {% if state_attr(e, 'hvac_action') == 'heating' %}{% set ns.n = ns.n + 1 %}{% endif %}
        {% endfor %}
        {{ ns.n }}
      active_zones: >-
        {% set ns = namespace(a=0) %}
        {% for e in zone_climate_entities %}
          {% if states(e) not in ['off', 'unavailable', 'unknown'] %}{% set ns.a = ns.a + 1 %}{% endif %}
        {% endfor %}
        {{ ns.a }}
      dhw_priority_state: "{{ states('sensor.opt_boiler_has_priority_hot_water_41287') }}"
      dhw_active: >-
        {% set prio = states('sensor.prio_43086') %}
        {% if prio not in ['unknown', 'unavailable', 'none', ''] %}
          {{ 'water' in prio|lower }}
        {% elif dhw_priority_state not in ['unknown', 'unavailable', ''] %}
          {{ dhw_priority_state|int(0) == 1 }}
        {% else %}
          false
        {% endif %}
      zone_restrict: "{{ autopilot_on and (active_zones|int(0) > 0) and (not dhw_active) }}"
      zone_comp_cap_hz: >-
        {% set n = open_zones|int(0) %}
        {% if n >= 5 %}120{% elif n == 4 %}100{% elif n == 3 %}85{% elif n == 2 %}65{% elif n == 1 %}55{% else %}50{% endif %}
      target_comp_hz: >-
        {% if zone_restrict %}
          {{ [ noise_target_hz|float, zone_comp_cap_hz|float ] | min }}
        {% else %}
          {{ noise_target_hz|float }}
        {% endif %}
  - choose:
      - conditions:
          - condition: template
            value_template: >-
              {{
                (states('number.max_comp_freq_47104')|float(-1) - target_comp_hz|float)|abs > 0.4
              }}
        sequence:
          - data:
              value: "{{ target_comp_hz }}"
            target:
              entity_id: number.max_comp_freq_47104
            action: number.set_value
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ in_night_window }}"
          - condition: state
            entity_id: switch.hot_water_high_power_mode_48743
            state: "on"
        sequence:
          - target:
              entity_id: switch.hot_water_high_power_mode_48743
            action: switch.turn_off
mode: single
